[project]
name = "tecnobot"
version = "0.1.0"
description = "WhatsApp bot de Tecnocar: presupuestos y derivación a humano"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.6.0",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2.0",
    "openai>=1.54.0",
    "ddgs>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["prompts/*.md", "skills/data/*.csv"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
